apiVersion: platform.example.io/v1alpha1
kind: Service
metadata:
  name: payment-api
spec:
  owner: payments-team
  image: ghcr.io/example/payment-api:v0.1.0
  port: 8080
  resources:
    size: small
  availability:
    replicas: 2
  observability:
    enabled: true
  health:
    livenessPath: /healthz
    readinessPath: /readyz
