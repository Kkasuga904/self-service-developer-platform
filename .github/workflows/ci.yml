name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sample-app/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test ./...
        working-directory: sample-app
      - run: go vet ./...
        working-directory: sample-app
      - run: go build ./cmd/platform

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Validate Platform Service contracts
        run: |
          go run ./cmd/platform validate services/payments-team/payment-api/service.yaml
          go run ./cmd/platform validate services/orders-team/order-api/service.yaml
      - name: Lint and render Golden Path
        run: |
          helm lint charts/golden-path -f services/payments-team/payment-api/service.yaml
          helm lint charts/golden-path -f services/orders-team/order-api/service.yaml
          helm template payment-api charts/golden-path \
            -f services/payments-team/payment-api/service.yaml > rendered-payments.yaml
          helm template order-api charts/golden-path \
            -f services/orders-team/order-api/service.yaml > rendered-orders.yaml
          helm template payment-api-autoscaled charts/golden-path \
            -f services/payments-team/payment-api/service.yaml \
            --set spec.autoscaling.enabled=true \
            --set spec.autoscaling.minReplicas=2 \
            --set spec.autoscaling.maxReplicas=4 \
            --set spec.autoscaling.targetCPUUtilization=60 > rendered-hpa.yaml
      - name: Install kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: kubeconform -strict -summary -kubernetes-version 1.35.0 rendered-payments.yaml rendered-orders.yaml rendered-hpa.yaml
      - run: kubectl kustomize gitops/platform >/dev/null
      - name: Validate observability manifests
        # PrometheusRule is a monitoring CRD: even --dry-run=client asks the
        # API server for discovery, so there is no cluster-free kubectl check.
        # Rule content is asserted in Go (internal/guardrails, run in the go
        # job); here we check JSON validity and kustomize rendering only.
        run: |
          kubectl kustomize gitops/platform >/dev/null
          python3 -c "import json; json.load(open('observability/dashboards/golden-path-overview.json'))"

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: 'v1.19.1'
      - run: kyverno version
      - name: Run platform guardrail tests (cases A-E)
        run: kyverno test policies/tests/

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: infra/.terraform,policies/tests

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: sample-app
          push: false
          tags: platform-sample-app:${{ github.sha }}

  aws-oidc:
    if: ${{ vars.AWS_VALIDATION_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Record non-secret OIDC claims
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({ sub: claims.sub, aud: claims.aud, repository: claims.repository, ref: claims.ref }));
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_VALIDATION_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Verify federated identity
        run: aws sts get-caller-identity
      - name: Verify least-privilege cluster discovery
        run: aws eks describe-cluster --name developer-platform-dev --query 'cluster.[name,status,version]' --output table
