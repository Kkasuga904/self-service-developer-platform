# Case E fixture: a valid Golden Path-style workload. Must PASS all policies.
# The image digest below is a fixture value, not a real artifact.
apiVersion: v1
kind: Pod
metadata:
  name: valid-workload
  namespace: team-payments
  labels:
    platform.example.io/owner: payments-team
    platform.example.io/service: payment-api
    platform.example.io/environment: dev
    app.kubernetes.io/managed-by: Helm
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
