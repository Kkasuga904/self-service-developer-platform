# Platform guardrail: every container must run as a non-root user, either via
# the pod-level securityContext (as the Golden Path sets) or per container.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/severity: high
spec:
  background: false
  validationFailureAction: Enforce
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                - kyverno
                - monitoring
      validate:
        message: "Running as root is not allowed; set runAsNonRoot to true at pod or container level."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ request.object.spec.securityContext.runAsNonRoot || 'false' }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.runAsNonRoot || 'false' }}"
                    operator: NotEquals
                    value: true
