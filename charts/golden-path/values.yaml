apiVersion: platform.example.io/v1alpha1
kind: Service
metadata:
  name: example-service
spec:
  owner: payments-team
  environment: dev
  contact: payments-team@example.com
  image: ghcr.io/example/example-service:v0.1.0
  port: 8080
  resources:
    size: small
  availability:
    replicas: 2
  observability:
    enabled: true
  health:
    livenessPath: /healthz
    readinessPath: /readyz
